[project]
name = "openstack-vm-api"
version = "0.2.0"
description = "Disaster Recovery orchestration platform for OpenStack VM lifecycle (FastAPI)"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Assessment Prototype" }]
dependencies = [
  "fastapi>=0.110,<0.116",
  "uvicorn[standard]>=0.29,<0.33",
  "openstacksdk>=3.0,<5.0",
  "keystoneauth1>=5.6,<6.0",
  "pydantic>=2.6,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "greenlet>=3.0,<4.0",
  "aiosqlite>=0.19,<1.0",
  "tenacity>=8.2,<10.0",
  "prometheus-fastapi-instrumentator>=7.0,<8.0",
  "python-json-logger>=2.0,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "pytest-cov>=5.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.4,<1.0",
  "black>=24.0,<26.0",
  "mypy>=1.8,<2.0",
  "pre-commit>=3.6,<5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.mypy]
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
ignore_missing_imports = true
