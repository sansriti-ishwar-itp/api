# One-command demo: `docker compose up --build`
#
# Brings up the DR control plane in mock mode so reviewers can run an entire
# snapshot -> migrate -> restore pipeline against the in-memory adapter
# without an OpenStack cluster. SQLite state lives in a named volume so jobs
# and audit events persist across restarts.
#
# Phase 2 (Celery + Redis + Postgres) sketch is included as commented stubs
# below; uncomment to scale the same code path to a survivable deployment.

services:
  api:
    build: .
    image: dr-orchestrator:dev
    ports:
      - "8000:8000"
    environment:
      ADAPTER_MODE: mock
      DATABASE_URL: sqlite+aiosqlite:////app/data/dr.db
      DEFAULT_RTO_MINUTES: "15"
      MOCK_LATENCY_MS: "250"
    volumes:
      - dr_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5

